<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1117" />
    <meta name="description" content="LPREX — Your LP, rebalanced automatically. Auto-rebalancing for concentrated liquidity on Uniswap v3 and HyperSwap V3." />
    <title>LPREX | LP Auto-Rebalancing System</title>
    <style>html,body{color:#e8eef3;background:#0b1117;margin:0;font-family:Hiragino Sans,Noto Sans JP,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif}#boot{text-align:center;padding:48px 20px;font-size:15px;line-height:1.7}#boot b{color:#3ddc97;letter-spacing:.14em;font-size:18px}#boot-err{text-align:left;color:#ff9b9b;word-break:break-all;background:#1a1215;border:1px solid #5a2a2a;border-radius:10px;max-width:520px;margin:16px auto 0;padding:10px 12px;font-size:12px;display:none}</style>
    <script>
      // 画面が出ないときに原因を表示する（読み込み失敗・古いブラウザなど）
      (function () {
        function show(msg) {
          var el = document.getElementById("boot-err");
          if (!el) return;
          el.style.display = "block";
          el.textContent += (el.textContent ? "\n" : "") + msg;
        }
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) show("ファイルを読み込めませんでした: " + (t.src || t.href));
          else show("エラー: " + (e.message || "不明"));
        }, true);
        window.addEventListener("unhandledrejection", function (e) { show("エラー: " + (e.reason && e.reason.message || e.reason)); });
        setTimeout(function () {
          if (document.getElementById("boot")) show("30秒たっても画面が出ません。通信が遅いか、このブラウザが対応していない可能性があります。再読み込みしてみてください。");
        }, 30000);
      })();
    </script>
    <script type="module" crossorigin src="./app.js"></script>
    <link rel="stylesheet" crossorigin href="./index.css">
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <b>◆ LPREX</b><br />読み込み中…
        <div id="boot-err"></div>
      </div>
    </div>
  </body>
</html>
